<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Runna - Upload Proof</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Instrument+Sans:ital,wght@0,400..700;1,400..700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#51df8e",
                        "on-primary-fixed-variant": "#0035bd",
                        "on-secondary-fixed-variant": "#8c1900",
                        "primary-fixed": "#dde1ff",
                        "primary": "#003bcd",
                        "inverse-surface": "#2c303f",
                        "on-background": "#171b29",
                        "secondary-fixed": "#ffdad2",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#ffb4a3",
                        "on-surface": "#171b29",
                        "surface-bright": "#faf8ff",
                        "outline": "#747688",
                        "background-cool": "#F7F8FB",
                        "on-tertiary-container": "#72fea9",
                        "on-surface-variant": "#434656",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f3ff",
                        "surface": "#faf8ff",
                        "on-primary-fixed": "#001355",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-white": "#FFFFFF",
                        "on-primary-container": "#dfe2ff",
                        "surface-tint": "#0048f6",
                        "ink-muted": "#6B7280",
                        "outline-variant": "#c4c5d9",
                        "on-secondary-container": "#640f00",
                        "tertiary-container": "#007541",
                        "primary-fixed-dim": "#b8c3ff",
                        "tertiary-fixed": "#70fda7",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#3d0600",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#00522c",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#dfe1f5",
                        "tertiary": "#005a31",
                        "surface-container": "#ebedff",
                        "surface-dim": "#d6d9ed",
                        "secondary-container": "#fd6a49",
                        "surface-container-high": "#e4e7fb",
                        "primary-container": "#1550ff",
                        "secondary": "#ae3115",
                        "surface-variant": "#dfe1f5",
                        "inverse-primary": "#b8c3ff",
                        "inverse-on-surface": "#eff0ff",
                        "on-tertiary-fixed": "#00210e",
                        "background": "#faf8ff",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "20px",
                        "lg": "24px",
                        "base": "8px",
                        "xl": "32px",
                        "sm": "12px",
                        "gutter": "16px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Bricolage Grotesque"],
                        "label-bold": ["Instrument Sans"],
                        "headline-lg": ["Bricolage Grotesque"],
                        "price-display": ["Bricolage Grotesque"],
                        "headline-sm": ["Bricolage Grotesque"],
                        "body-md": ["Instrument Sans"],
                        "body-lg": ["Instrument Sans"],
                        "body-sm": ["Instrument Sans"],
                        "headline-md": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["14px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "price-display": ["18px", { "lineHeight": "18px", "fontWeight": "800" }],
                        "headline-sm": ["20px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "30px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .timeline-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background-cool min-h-screen text-on-surface antialiased flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-on-background shadow-[0px_4px_20px_rgba(21,80,255,0.08)]">
<div class="flex items-center justify-between px-container-margin py-base w-full max-w-7xl mx-auto h-16">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:opacity-80 transition-opacity active:scale-95 text-on-surface-variant dark:text-outline-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface absolute left-1/2 -translate-x-1/2">Upload Proof</h1>
<div class="w-10 h-10"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-container-margin py-lg max-w-md mx-auto w-full pb-32">
<!-- Instructional Heading -->
<div class="mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-xs">Show the results</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Snap a pic to prove you nailed it.</p>
</div>
<!-- Requirement Card -->
<div class="bg-surface rounded-xl p-md shadow-[0px_4px_20px_rgba(21,80,255,0.08)] mb-xl flex items-start gap-sm border border-surface-container-highest">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 mt-xs">
<span class="material-symbols-outlined text-on-primary-fixed-variant text-[18px]" data-icon="task_alt" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-outline mb-xs">REQUIREMENT</p>
<p class="font-body-md text-body-md text-on-surface">Show the delivered package at Room 402</p>
</div>
</div>
<!-- Upload Area -->
<button class="w-full aspect-square rounded-[24px] border-2 border-dashed border-primary-container bg-surface flex flex-col items-center justify-center gap-sm mb-xl hover:bg-surface-container-lowest transition-colors group active:scale-[0.98] duration-200">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="photo_camera">photo_camera</span>
</div>
<p class="font-label-bold text-label-bold text-primary">Tap to take a photo or upload</p>
<p class="font-body-sm text-body-sm text-outline">JPG, PNG up to 10MB</p>
</button>
<!-- Progress Timeline (Signature Element) -->
<div class="mt-auto mb-lg bg-surface rounded-xl p-md shadow-[0px_4px_20px_rgba(21,80,255,0.08)]">
<div class="flex items-center justify-between relative">
<!-- Connecting Line -->
<div class="absolute left-4 right-4 top-1/2 -translate-y-1/2 h-0.5 border-t-2 border-dashed border-outline-variant z-0"></div>
<div class="absolute left-4 top-1/2 -translate-y-1/2 h-0.5 bg-primary z-0 transition-all duration-1000 w-1/2"></div>
<!-- Stage 1 -->
<div class="relative z-10 flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[16px] text-on-primary" data-icon="check">check</span>
</div>
<span class="font-label-bold text-label-bold text-on-surface-variant text-[10px] uppercase">Picked Up</span>
</div>
<!-- Stage 2 (Current) -->
<div class="relative z-10 flex flex-col items-center gap-xs">
<div class="relative">
<div class="absolute inset-0 bg-secondary rounded-full timeline-pulse"></div>
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center relative shadow-md">
<span class="material-symbols-outlined text-[16px] text-on-secondary" data-icon="local_shipping">local_shipping</span>
</div>
</div>
<span class="font-label-bold text-label-bold text-secondary text-[10px] uppercase">Delivering</span>
</div>
<!-- Stage 3 (Future) -->
<div class="relative z-10 flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border-2 border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-outline-variant" data-icon="flag">flag</span>
</div>
<span class="font-label-bold text-label-bold text-outline-variant text-[10px] uppercase">Completed</span>
</div>
</div>
</div>
<!-- Primary Button -->
<button class="w-full bg-secondary text-on-secondary font-headline-sm text-headline-sm py-4 rounded-xl shadow-[0px_8px_16px_rgba(253,106,73,0.2)] hover:opacity-90 active:scale-95 transition-all" style="background-color: rgb(255, 107, 74);">
            Submit Proof
        </button>
</main>
<!-- BottomNavBar (Hidden on md/desktop as per Semantic Shell Mandate, shown on mobile) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 px-gutter pb-6 pt-2 bg-surface dark:bg-inverse-surface shadow-[0px_-4px_20px_rgba(21,80,255,0.08)] flex justify-around items-center backdrop-blur-md bg-surface/80">
<button class="flex flex-col items-center justify-center text-outline dark:text-outline-variant px-4 py-2 hover:text-secondary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="search">explore</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px]">Explore</span>
</button>
<!-- Active Tab: Hustle (Semantic match for task execution) -->
<button class="flex flex-col items-center justify-center bg-secondary dark:bg-secondary-container text-on-secondary dark:text-on-secondary-container rounded-xl px-4 py-2 hover:opacity-90 transition-opacity active:scale-90 duration-200 shadow-md" style="background-color: rgb(255, 107, 74); color: white;">
<span class="material-symbols-outlined" data-icon="bolt" data-weight="fill">bolt</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px]">Hustle</span>
</button>
<button class="flex flex-col items-center justify-center text-outline dark:text-outline-variant px-4 py-2 hover:text-secondary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px]">Messages</span>
</button>
<button class="flex flex-col items-center justify-center text-outline dark:text-outline-variant px-4 py-2 hover:text-secondary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-bold text-label-bold mt-1 text-[10px]">Profile</span>
</button>
</nav>


</body></html>

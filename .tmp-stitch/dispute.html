<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Runna - Report Issue Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#434656",
                        "surface-variant": "#dfe1f5",
                        "surface-container-high": "#e4e7fb",
                        "inverse-primary": "#b8c3ff",
                        "tertiary-fixed-dim": "#51df8e",
                        "on-background": "#171b29",
                        "primary-fixed": "#dde1ff",
                        "secondary": "#ae3115",
                        "surface-bright": "#faf8ff",
                        "tertiary-container": "#007541",
                        "surface-white": "#FFFFFF",
                        "on-primary-container": "#dfe2ff",
                        "primary-fixed-dim": "#b8c3ff",
                        "on-surface": "#171b29",
                        "secondary-fixed-dim": "#ffb4a3",
                        "on-primary-fixed-variant": "#0035bd",
                        "surface-dim": "#d6d9ed",
                        "tertiary": "#005a31",
                        "surface-container-lowest": "#ffffff",
                        "background": "#faf8ff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "ink-muted": "#6B7280",
                        "surface-container": "#ebedff",
                        "on-secondary-container": "#640f00",
                        "primary": "#003bcd",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#3d0600",
                        "outline": "#747688",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#72fea9",
                        "on-secondary-fixed-variant": "#8c1900",
                        "outline-variant": "#c4c5d9",
                        "secondary-container": "#fd6a49",
                        "surface-tint": "#0048f6",
                        "surface": "#faf8ff",
                        "on-tertiary-fixed-variant": "#00522c",
                        "inverse-surface": "#2c303f",
                        "inverse-on-surface": "#eff0ff",
                        "secondary-fixed": "#ffdad2",
                        "surface-container-low": "#f2f3ff",
                        "on-tertiary-fixed": "#00210e",
                        "surface-container-highest": "#dfe1f5",
                        "tertiary-fixed": "#70fda7",
                        "background-cool": "#F7F8FB",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#001355",
                        "on-secondary": "#ffffff",
                        "primary-container": "#1550ff",
                        "coral": "#FF6B4A",
                        "ink": "#191D2B",
                        "signal-blue": "#1550FF"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "xl": "32px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "container-margin": "20px",
                        "base": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Instrument Sans"],
                        "label-bold": ["Instrument Sans"],
                        "headline-md": ["Bricolage Grotesque"],
                        "headline-lg": ["Bricolage Grotesque"],
                        "body-md": ["Instrument Sans"],
                        "headline-xl": ["Bricolage Grotesque"],
                        "body-lg": ["Instrument Sans"],
                        "price-display": ["Bricolage Grotesque"],
                        "headline-sm": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-bold": ["14px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "price-display": ["18px", { "lineHeight": "18px", "fontWeight": "800" }],
                        "headline-sm": ["20px", { "lineHeight": "26px", "fontWeight": "600" }]

                }
            }
        }

<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-surface-white/90 backdrop-blur-md border border-surface-white/20;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-cool min-h-screen flex items-end justify-center sm:items-center antialiased font-body-md text-on-surface">
<!-- Dimmed Backdrop -->
<div class="fixed inset-0 bg-ink/40 backdrop-blur-[2px] z-40 transition-opacity duration-300"></div>
<!-- Bottom Sheet Modal -->
<div class="relative z-50 w-full sm:w-full sm:max-w-md bg-surface-white rounded-t-[1.5rem] sm:rounded-[1.5rem] shadow-[0_-8px_32px_rgba(21,80,255,0.08)] transform transition-transform duration-300 translate-y-0 pb-container-margin">
<!-- Drag Handle (Mobile) -->
<div class="flex justify-center pt-sm pb-xs sm:hidden">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<div class="px-container-margin pt-lg sm:pt-xl pb-lg flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-primary-container">What went wrong?</h2>
<button class="text-on-surface-variant hover:text-on-surface p-2 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<p class="font-body-md text-body-md text-ink-muted">Please provide details so we can help resolve the issue quickly.</p>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-lg">
<!-- Textarea -->
<div class="flex flex-col gap-sm relative group">
<textarea class="w-full bg-surface-white border border-outline-variant rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all resize-none shadow-sm" placeholder="Tell us what happened..." rows="4"></textarea>
<!-- Decorative Route Path Line -->
<div class="absolute left-[-8px] top-4 bottom-4 w-[2px] border-l-2 border-dashed border-primary-container/30 hidden group-focus-within:block"></div>
</div>
<!-- Reassuring Microcopy -->
<div class="flex items-start gap-3 bg-surface-container-low p-4 rounded-xl border border-surface-container-highest">
<span class="material-symbols-outlined text-primary-container shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">shield</span>
<p class="font-body-sm text-body-sm text-on-surface">
<strong class="font-label-bold text-label-bold">Payment is on hold</strong> until this is resolved. Your funds are secure in escrow.
                    </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-md pt-md">
<button class="w-full bg-secondary-container hover:bg-[#E55A3B] text-surface-white font-headline-sm text-headline-sm py-4 rounded-[1rem] shadow-[0_4px_12px_rgba(253,106,73,0.25)] hover:shadow-[0_6px_16px_rgba(253,106,73,0.35)] transition-all active:scale-[0.98]" type="button">
                        Submit report
                    </button>
<button class="w-full text-primary-container font-label-bold text-label-bold py-3 hover:bg-surface-container-low rounded-[1rem] transition-colors" type="button">
                        Cancel
                    </button>
</div>
</form>
</div>
</div>
</body></html>
